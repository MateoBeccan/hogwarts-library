databaseChangeLog:

  - changeSet:
      id: 002-001-create-secuencia-codigo
      author: mateo
      changes:
        - createTable:
            tableName: secuencia_codigo
            columns:
              - column:
                  name: nombre
                  type: VARCHAR(50)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ultimo_valor
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-002-initialize-ejemplar-code-sequence
      author: mateo
      changes:
        - sql:
            dbms: mysql
            sql: |
              INSERT INTO secuencia_codigo (nombre, ultimo_valor)
              SELECT
                  'EJEMPLAR',
                  COALESCE(MAX(CAST(SUBSTRING(codigo, 5) AS UNSIGNED)), 0)
              FROM ejemplar
              WHERE codigo REGEXP '^HOG-[0-9]{6}$';
