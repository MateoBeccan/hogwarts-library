  # Rebuild the sequence without dropping its old, potentially clustered PK.
  # Preserve nombre's historical collation using metadata in the creation statement.
  - changeSet:
      id: 004-create-sequence-stage
      author: hogwarts-library
      runInTransaction: false
      changes:
        - sql:
            sql: |
              SET @sequence_ddl = (
                  SELECT CONCAT('CREATE TABLE secuencia_codigo_004 (scope_id BIGINT NOT NULL, nombre VARCHAR(50) CHARACTER SET ',
                                CHARACTER_SET_NAME, ' COLLATE ', COLLATION_NAME,
                                ' NOT NULL, ultimo_valor BIGINT NOT NULL, PRIMARY KEY (scope_id, nombre)) ENGINE=InnoDB')
                  FROM information_schema.COLUMNS
                  WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'secuencia_codigo' AND COLUMN_NAME = 'nombre'
              );
              PREPARE sequence_ddl FROM @sequence_ddl;
              EXECUTE sequence_ddl;
              DEALLOCATE PREPARE sequence_ddl;

  - changeSet:
      id: 004-sequence-stage-fk
      author: hogwarts-library
      runInTransaction: false
      changes:
        - sql:
            sql: |
              ALTER TABLE secuencia_codigo_004 ADD CONSTRAINT fk_secuencia_codigo_scope FOREIGN KEY (scope_id) REFERENCES library_scope (id)

  - changeSet:
      id: 004-copy-sequence-stage
      author: hogwarts-library
      changes:
        - sql:
            sql: |
              INSERT INTO secuencia_codigo_004 (scope_id, nombre, ultimo_valor)
              SELECT scope_id, nombre, ultimo_valor FROM secuencia_codigo

  - changeSet:
      id: 004-switch-sequence
      author: hogwarts-library
      runInTransaction: false
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT (SELECT COUNT(*) FROM secuencia_codigo) <> (SELECT COUNT(*) FROM secuencia_codigo_004)
                   OR EXISTS (
                       SELECT 1 FROM secuencia_codigo old_seq
                       LEFT JOIN secuencia_codigo_004 new_seq
                           ON new_seq.scope_id = old_seq.scope_id AND new_seq.nombre = old_seq.nombre
                       WHERE new_seq.nombre IS NULL OR new_seq.ultimo_valor <> old_seq.ultimo_valor
                   )
      changes:
        - sql:
            sql: |
              RENAME TABLE secuencia_codigo TO secuencia_codigo_pre004, secuencia_codigo_004 TO secuencia_codigo

  - changeSet:
      id: 004-retire-global-categoria-nombre
      author: hogwarts-library
      runInTransaction: false
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT IF(COUNT(*) = 2 AND GROUP_CONCAT(COLUMN_NAME ORDER BY SEQ_IN_INDEX) = 'scope_id,nombre', 1, 0)
              FROM information_schema.STATISTICS
              WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'categoria'
                AND INDEX_NAME = 'uk_categoria_s_nombre' AND NON_UNIQUE = 0
      changes:
        - sql:
            sql: |
              ALTER TABLE categoria DROP INDEX uk_categoria_nombre

