      author: hogwarts-library
      changes:
        - sql:
            sql: |
              UPDATE categoria SET scope_id = 1 WHERE scope_id IS NULL;
              UPDATE autor SET scope_id = 1 WHERE scope_id IS NULL;
              UPDATE libro SET scope_id = 1 WHERE scope_id IS NULL;
              UPDATE libro_autor SET scope_id = 1 WHERE scope_id IS NULL;
              UPDATE cliente SET scope_id = 1 WHERE scope_id IS NULL;
              UPDATE ejemplar SET scope_id = 1 WHERE scope_id IS NULL;
              UPDATE alquiler SET scope_id = 1 WHERE scope_id IS NULL;
              UPDATE detalle_alquiler SET scope_id = 1 WHERE scope_id IS NULL;
              UPDATE pago SET scope_id = 1 WHERE scope_id IS NULL;
              UPDATE secuencia_codigo SET scope_id = 1 WHERE scope_id IS NULL;

  - changeSet:
      id: 004-verify-backfill
      author: hogwarts-library
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM library_scope WHERE id = 1 AND tipo = 'LEGACY'
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM secuencia_codigo WHERE scope_id = 1 AND nombre = 'EJEMPLAR'
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT (SELECT COUNT(*) FROM categoria WHERE scope_id IS NULL OR scope_id <> 1)
                   + (SELECT COUNT(*) FROM autor WHERE scope_id IS NULL OR scope_id <> 1)
                   + (SELECT COUNT(*) FROM libro WHERE scope_id IS NULL OR scope_id <> 1)
                   + (SELECT COUNT(*) FROM libro_autor WHERE scope_id IS NULL OR scope_id <> 1)
                   + (SELECT COUNT(*) FROM cliente WHERE scope_id IS NULL OR scope_id <> 1)
                   + (SELECT COUNT(*) FROM ejemplar WHERE scope_id IS NULL OR scope_id <> 1)
                   + (SELECT COUNT(*) FROM alquiler WHERE scope_id IS NULL OR scope_id <> 1)
                   + (SELECT COUNT(*) FROM detalle_alquiler WHERE scope_id IS NULL OR scope_id <> 1)
                   + (SELECT COUNT(*) FROM pago WHERE scope_id IS NULL OR scope_id <> 1)
                   + (SELECT COUNT(*) FROM secuencia_codigo WHERE scope_id IS NULL OR scope_id <> 1)
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT (SELECT COUNT(*) FROM libro c
                    LEFT JOIN categoria p ON p.id = c.categoria_id AND p.scope_id = c.scope_id WHERE p.id IS NULL)
                   + (SELECT COUNT(*) FROM libro_autor c
                    LEFT JOIN libro p ON p.id = c.libro_id AND p.scope_id = c.scope_id WHERE p.id IS NULL)
                   + (SELECT COUNT(*) FROM libro_autor c
                    LEFT JOIN autor p ON p.id = c.autor_id AND p.scope_id = c.scope_id WHERE p.id IS NULL)
                   + (SELECT COUNT(*) FROM ejemplar c
                    LEFT JOIN libro p ON p.id = c.libro_id AND p.scope_id = c.scope_id WHERE p.id IS NULL)
                   + (SELECT COUNT(*) FROM alquiler c
                    LEFT JOIN cliente p ON p.id = c.cliente_id AND p.scope_id = c.scope_id WHERE p.id IS NULL)
                   + (SELECT COUNT(*) FROM detalle_alquiler c
                    LEFT JOIN alquiler p ON p.id = c.alquiler_id AND p.scope_id = c.scope_id WHERE p.id IS NULL)
                   + (SELECT COUNT(*) FROM detalle_alquiler c
                    LEFT JOIN ejemplar p ON p.id = c.ejemplar_id AND p.scope_id = c.scope_id WHERE p.id IS NULL)
                   + (SELECT COUNT(*) FROM pago c
                    LEFT JOIN alquiler p ON p.id = c.alquiler_id AND p.scope_id = c.scope_id WHERE p.id IS NULL)
      changes:
        - sql:
            sql: |
              SELECT 1

