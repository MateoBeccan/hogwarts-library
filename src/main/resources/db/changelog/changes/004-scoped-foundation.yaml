databaseChangeLog:
  - preConditions:
      - dbms:
          type: mysql
      - sqlCheck:
          expectedResult: 1
          sql: SELECT @@SESSION.foreign_key_checks

  - changeSet:
      id: 004-create-scope
      author: hogwarts-library
      runInTransaction: false
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT @@SESSION.foreign_key_checks
      changes:
        - sql:
            sql: |
              CREATE TABLE library_scope (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  tipo VARCHAR(12) NOT NULL,
                  public_id CHAR(32) CHARACTER SET ascii COLLATE ascii_bin,
                  created_at DATETIME(6) NOT NULL,
                  expires_at DATETIME(6),
                  closed_at DATETIME(6),
                  generacion INT NOT NULL DEFAULT 0,
                  fecha_negocio DATE,
                  version_semilla VARCHAR(32),
                  mutaciones INT NOT NULL DEFAULT 0,
                  restauraciones INT NOT NULL DEFAULT 0,
                  ultima_restauracion_at DATETIME(6),
                  PRIMARY KEY (id),
                  UNIQUE KEY uk_scope_public_id (public_id),
                  KEY idx_scope_expiry (tipo, expires_at, id),
                  KEY idx_scope_closed (tipo, closed_at, id)
              ) ENGINE=InnoDB

  - changeSet:
      id: 004-reserve-legacy
      author: hogwarts-library
      changes:
        - sql:
            sql: |
              INSERT INTO library_scope (id, tipo, created_at) VALUES (1, 'LEGACY', UTC_TIMESTAMP(6))

