spring.application.name=hogwarts-library

# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/hogwarts_library_db?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# LIQUIBASE
spring.liquibase.enabled=true

app.alquiler.max-ejemplares=3
app.alquiler.max-dias=14

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000