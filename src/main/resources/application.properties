spring.application.name=hogwarts-library
spring.profiles.default=dev
spring.profiles.group.prod=hosted
spring.profiles.group.demo=hosted
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.mvc.log-request-details=false

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

app.alquiler.max-ejemplares=3
app.alquiler.max-dias=14
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
