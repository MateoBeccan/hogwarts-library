spring.datasource.url=jdbc:mysql://localhost:3306/hogwarts_library_db?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.alquiler.max-ejemplares=3
app.alquiler.max-dias=14

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000